; bike-hub 固件工程
;
; 目标硬件：ESP32-S3 + Air780EG（4G+GNSS）+ LIS3DH + MAX98357A
;
; 两套环境区别只在于串口走哪里：
;   s3-uart  板上 UART 转串口芯片（CP2102/CH340）→ 大多数开发板的 "UART/COM" 口
;   s3-usb   芯片原生 USB（GPIO19/20）→ 板子上标 "USB" 的口
;
; 用法：
;   pio run                     编译默认环境
;   pio run -e s3-usb           编译 USB 串口版本
;   pio run -t upload           烧录
;   pio device monitor          看串口日志
;

[platformio]
default_envs = s3-uart

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time
upload_speed = 921600
; Arduino 框架自带一个 CORE_DEBUG_LEVEL 默认定义，先撤掉再覆盖，避免 redefined 警告
build_unflags =
    -DCORE_DEBUG_LEVEL=0
build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=3

[env:s3-uart]

[env:s3-usb]
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
